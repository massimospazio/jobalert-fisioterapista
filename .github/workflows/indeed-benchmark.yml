name: Indeed Coverage Benchmark

on:
  push:
    branches:
      - v2-core
    paths:
      - state/indeed-benchmark-trigger.txt

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Indeed benchmark
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
        run: python tools/indeed_benchmark.py

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indeed-benchmark
          path: logs/indeed_benchmark.json
          if-no-files-found: warn
