name: V2 Core Tests

on:
  push:
    branches:
      - v2-core
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install v2 dependencies
        run: pip install "PyYAML>=6.0" requests beautifulsoup4 lxml playwright

      - name: Install Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run unit tests
        run: python -m unittest tests/test_core.py -v

      - name: Probe ZenRows on Bakeca
        if: ${{ env.ZENROWS_API_KEY != '' }}
        env:
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python tools/zenrows_probe.py

      - name: Upload ZenRows diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenrows-bakeca-diagnostics
          path: diagnostics_zenrows/*
          if-no-files-found: warn

      - name: Probe Subito and Lavoro.it
        run: python tools/browser_probe.py

      - name: Run Bakeca audit
        run: python main_v2.py

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-audit
          path: logs/*.jsonl
          if-no-files-found: warn

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-browser-diagnostics
          path: |
            diagnostics/*
            diagnostics_browser/*
          if-no-files-found: warn
