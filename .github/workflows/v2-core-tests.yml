name: V2 Core Tests

on:
  push:
    branches:
      - v2-core
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install v2 dependencies
        run: pip install "PyYAML>=6.0" requests beautifulsoup4 lxml playwright pypdf

      - name: Install Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run unit tests
        run: python -m unittest tests/test_core.py -v

      - name: Probe core sources for free
        run: python tools/core_sources_probe.py

      - name: Upload core source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-source-diagnostics
          path: diagnostics_core_sources/*
          if-no-files-found: warn

      - name: Probe ZenRows on Bakeca
        if: ${{ github.event_name == 'workflow_dispatch' && env.ZENROWS_KEY != '' }}
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
        run: python tools/zenrows_probe.py

      - name: Upload ZenRows diagnostics
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: zenrows-bakeca-diagnostics
          path: diagnostics_zenrows/*
          if-no-files-found: warn

      - name: Extract baseline jobs
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]') }}
        env:
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
        run: python tools/baseline_extract.py

      - name: Merge OFI Lazio offers
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]') }}
        run: python tools/baseline_ofi_merge.py

      - name: Enrich LinkedIn and OFI details for free
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]') }}
        run: python tools/baseline_enrich_free.py

      - name: Finalize baseline and initialize state
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]') }}
        run: python tools/baseline_finalize.py

      - name: Upload baseline jobs
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[baseline]')) }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-jobs
          path: baseline/*
          if-no-files-found: warn

      - name: Probe Brave Search on Bakeca
        if: ${{ env.BRAVE_API_KEY != '' }}
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python tools/brave_probe.py

      - name: Upload Brave diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brave-bakeca-diagnostics
          path: diagnostics_brave/*
          if-no-files-found: warn

      - name: Probe Subito and Lavoro.it
        run: python tools/browser_probe.py

      - name: Run Bakeca audit
        run: python main_v2.py

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-audit
          path: logs/*.jsonl
          if-no-files-found: warn

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-browser-diagnostics
          path: |
            diagnostics/*
            diagnostics_browser/*
          if-no-files-found: warn
