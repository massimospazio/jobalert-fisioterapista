name: V2 Core Tests

on:
  push:
    branches:
      - v2-core
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: pip install PyYAML>=6.0

      - name: Run unit tests
        run: python -m unittest tests/test_core.py -v

      - name: Run demo audit
        run: python main_v2.py

      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: v2-core-audit
          path: logs/*.jsonl
