name: Job Alert Production Run

on:
  push:
    branches:
      - v2-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[production]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v2-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "PyYAML>=6.0" requests beautifulsoup4 lxml playwright pypdf

      - name: Install Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run integrated agent
        env:
          ALLOW_PAID_SOURCES: "true"
          PERSIST_BASELINE_DATA: "true"
          ZENROWS_KEY: ${{ secrets.ZENROWS_KEY }}
        run: python main_v2.py

      - name: Send new-job email
        if: success()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python tools/notify_email.py

      - name: Upload audit, new jobs and baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-alert-output
          path: |
            logs/*.jsonl
            logs/new_jobs.json
            data/baseline_jobs.json
            data/baseline_jobs.csv
          if-no-files-found: warn

      - name: Persist state and baseline on v2-core
        if: success()
        run: |
          if git diff --quiet -- state/baseline_state.json data/baseline_jobs.json data/baseline_jobs.csv; then
            echo "No state or baseline changes to persist"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/baseline_state.json data/baseline_jobs.json data/baseline_jobs.csv
          git commit -m "[state] Persist job alert state and baseline"
          git push origin HEAD:v2-core
